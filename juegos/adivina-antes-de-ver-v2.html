<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adiviná antes de ver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Estética de programa de preguntas: escenario violeta, tarjetas blancas, amarillo para la acción principal.
     Verde y rojo se reservan para acierto y error. */
  --stage:#2A1B5E; --stage-2:#4B2C9B; --white:#fff; --ink:#2A1B5E; --ink-2:#5B5280; --line:#E4DFF5; --badge:#5B3CC4;
  --yellow:#FFC93C; --yellow-d:#E0A800; --ok:#0E8F5B; --ok-bg:#DDF5EA; --bad:#D62A52; --bad-bg:#FFE0E7;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);background-image:radial-gradient(ellipse 80% 60% at 15% -10%,var(--stage-2),transparent 60%),radial-gradient(ellipse 70% 50% at 100% 110%,#7A2A8C88,transparent 60%);background-attachment:fixed;color:#fff;font-family:var(--body);font-size:18px;font-weight:500;line-height:1.4}
#app{min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

.top{display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:14px clamp(16px,3vw,40px);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:28px;line-height:1;color:var(--yellow);letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:14px;color:#CFC6F2;margin-top:4px;letter-spacing:0}
.progress{flex:1;display:flex;gap:8px;justify-content:center;min-width:140px}
.seg{width:clamp(22px,4vw,54px);height:14px;border-radius:7px;background:#ffffff26;border:2px solid transparent}
.seg.cur{background:transparent;border-color:var(--yellow)}
.seg.ok{background:#35D391}
.seg.no{background:#FF6B88}
.hud{display:flex;align-items:center;gap:14px;margin-left:auto}
.pts{font-family:var(--display);font-size:22px;white-space:nowrap;min-width:90px;text-align:right}
.pts b{font-size:36px;color:var(--yellow);font-weight:400}
.iconbtn{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:0;background:#ffffff1f;cursor:pointer;color:#fff}
.iconbtn:hover{background:#ffffff33}
.iconbtn svg{width:26px;height:26px}

main{flex:1;width:min(1200px,100%);margin:0 auto;padding:6px clamp(16px,3vw,40px) 34px;display:flex;flex-direction:column;gap:clamp(14px,2vw,22px)}

.qcard{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:var(--white);color:var(--ink);border-radius:24px;padding:clamp(16px,2.4vw,28px) clamp(18px,3vw,36px);box-shadow:0 8px 0 #0000004d}
.q{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.5vw,46px);line-height:1.08;margin:0;text-wrap:balance}
.qn{display:block;font-family:var(--body);font-weight:800;font-size:15px;color:var(--ink-2);margin-bottom:6px}
.ringw{position:relative;width:92px;height:92px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .bg{stroke:var(--line)} .ringw .fg{stroke:var(--badge);transition:stroke .2s}
.ringw .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:38px;color:var(--ink)}
.ringw.hot .fg{stroke:var(--bad)} .ringw.hot .num{color:var(--bad)}
.ringw.hot:not(.done){animation:pulse .5s ease-in-out infinite alternate}
.ringw.done .fg{stroke:var(--ink-2)}
@keyframes pulse{to{transform:scale(1.1)}}

.play{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(14px,2.2vw,30px);align-items:start}
.opts{display:flex;flex-direction:column;gap:14px}
.opts-cap{margin:0 0 2px;font-weight:800;color:#DAD3F7;font-size:18px}
.opt{display:grid;grid-template-columns:52px 1fr auto auto;gap:14px;align-items:center;text-align:left;background:var(--white);color:var(--ink);border:0;border-radius:18px;padding:12px 18px 12px 12px;box-shadow:0 6px 0 #0000004d;cursor:pointer;font-family:var(--display);font-size:clamp(22px,2.6vw,32px);line-height:1.1;transition:transform .1s,box-shadow .1s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 #0000004d}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #0000004d}
.opt:disabled{cursor:default}
.ltr{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--badge);color:#fff;font-size:28px}
.tag{font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink);background:var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.mark svg{width:34px;height:34px;display:block}
.opt.ok{background:var(--ok-bg);color:var(--ok);box-shadow:0 0 0 4px var(--ok),0 6px 0 #0000004d}
.opt.ok .ltr{background:var(--ok)}
.opt.no{background:var(--bad-bg);color:var(--bad);box-shadow:0 0 0 4px var(--bad),0 6px 0 #0000004d}
.opt.no .ltr{background:var(--bad)}
.opt.dim{opacity:.55}

.evi{position:relative;background:var(--white);color:var(--ink);border-radius:24px;box-shadow:0 8px 0 #0000004d;overflow:hidden;min-height:340px}
.evi h2{margin:0;padding:16px 22px 0;font-family:var(--body);font-weight:800;font-size:16px;color:var(--ink-2)}
.evi svg.ch{display:block;width:100%;height:auto}
.cover{position:absolute;inset:0;z-index:5;pointer-events:none}
.half{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#5B2BB0 0 22px,#44208C 22px 44px);transition:transform .95s cubic-bezier(.75,0,.25,1)}
.half.l{left:0;box-shadow:inset -10px 0 14px -8px #0006}
.half.r{right:0;box-shadow:inset 10px 0 14px -8px #0006}
.cmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:#fff;transition:opacity .35s}
.cmsg svg{width:60px;height:60px;color:var(--yellow)}
.cmsg b{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.4vw,44px);line-height:1;color:var(--yellow)}
.cmsg span{font-weight:700;font-size:clamp(16px,1.7vw,19px);max-width:24ch}
.evi.open .half.l{transform:translateX(-102%)}
.evi.open .half.r{transform:translateX(102%)}
.evi.open .cmsg{opacity:0}
.evi.open .cover{visibility:hidden;transition:visibility 0s 1s}
.evi.snap .half,.evi.snap .cmsg,.evi.snap .cover{transition:none}
.evi.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.t{fill:var(--ink)} .t2{fill:var(--ink-2)}
.gl{stroke:var(--line);stroke-width:1.5}
.ax{stroke:var(--ink);stroke-width:2}

.result{display:grid;grid-template-columns:1.05fr 1.5fr auto;gap:clamp(12px,2vw,28px);align-items:center;background:var(--ok);color:#fff;border-radius:24px;padding:clamp(16px,2vw,24px) clamp(18px,2.6vw,32px);box-shadow:0 8px 0 #0000004d}
.result.no{background:var(--bad)}
.verdict{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,38px);line-height:1.05;margin:0}
.verdict svg{width:40px;height:40px;flex:none}
.answer{margin:6px 0 0;font-size:clamp(16px,1.8vw,20px);font-weight:700}
.bonus{display:inline-block;margin-top:6px;background:#ffffff33;border-radius:999px;padding:3px 12px;font-weight:800;font-size:16px}
.note{margin:0;font-size:clamp(16px,1.7vw,19px);line-height:1.5;max-width:60ch}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:16px;padding:16px 28px;font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,30px);color:var(--ink);background:var(--yellow);cursor:pointer;line-height:1;box-shadow:0 6px 0 var(--yellow-d);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--yellow-d)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yellow-d)}
.btn.ghost{background:#ffffff1f;color:#fff;box-shadow:0 6px 0 #00000040}
.btn.big{font-size:clamp(28px,3.4vw,44px);padding:clamp(18px,2.4vw,26px) clamp(30px,4vw,54px)}

.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,9.5vw,124px);line-height:.92;margin:0 0 16px;color:var(--yellow);text-shadow:0 6px 0 #0000004d;text-wrap:balance}
.lede{font-size:clamp(18px,2vw,23px);max-width:44ch;margin:0;color:#E9E4FF}
.stagebox{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #0000004d;background:var(--white)}
.stagebox .half{animation:peek 3.2s ease-in-out infinite alternate}
.stagebox .half.r{animation-name:peek2}
@keyframes peek{from{transform:none}to{transform:translateX(-30%)}}
@keyframes peek2{from{transform:none}to{transform:translateX(30%)}}
.stagebox .cmsg{opacity:1}
.stagebox .bars{position:absolute;left:14%;right:14%;bottom:14%;height:55%;display:flex;align-items:flex-end;gap:7%}
.stagebox .bars i{flex:1;background:#A99BDB;border-radius:6px 6px 0 0}
.stagebox .bars i:nth-child(1){height:30%}.stagebox .bars i:nth-child(2){height:48%}.stagebox .bars i:nth-child(3){height:38%}.stagebox .bars i:nth-child(4){height:100%;background:#6D3BEA}.stagebox .bars i:nth-child(5){height:62%}
.set{display:flex;gap:clamp(14px,3vw,40px);flex-wrap:wrap;align-items:flex-end}
.set h3{margin:0 0 8px;font-family:var(--body);font-weight:800;font-size:17px;color:#DAD3F7}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:14px;padding:10px 18px;min-height:48px;font-family:var(--display);font-size:22px;background:#ffffff1f;color:#fff;cursor:pointer}
.chip:hover{background:#ffffff33}
.chip[aria-pressed=true]{background:var(--white);color:var(--ink);box-shadow:0 0 0 3px var(--yellow)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,24px);margin:0;padding:0;list-style:none}
.how li{background:#ffffff14;border-radius:16px;padding:14px 18px;font-size:18px}
.how b{color:var(--yellow);font-family:var(--display);font-weight:400;font-size:20px;margin-right:6px}
.src{font-size:14px;color:#BDB3E8;margin:0}

.final{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.final .n{font-family:var(--display);font-size:clamp(72px,14vw,170px);line-height:.9;color:var(--yellow);text-shadow:0 6px 0 #0000004d}
.final .tt{font-family:var(--display);font-size:clamp(26px,3.2vw,42px);line-height:1.1;max-width:20ch}
.final .pp{font-weight:800;font-size:20px;color:#DAD3F7;width:100%}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.recap li{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;background:var(--white);color:var(--ink);border-radius:14px;padding:12px 18px}
.recap .k{font-family:var(--display);font-size:22px;color:var(--badge)}
.recap .v{display:flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}
.recap .v svg{width:24px;height:24px}
.recap .ok{color:var(--ok)} .recap .no{color:var(--bad)}
.row-actions{display:flex;gap:16px;flex-wrap:wrap}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:11px;height:17px;border-radius:2px;animation:fall var(--d) cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}

@media (max-width:860px){
  .play,.hero{grid-template-columns:1fr}
  .result{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .recap li{grid-template-columns:30px 1fr}
  .recap .v{grid-column:2}
  .progress{order:3;flex-basis:100%}
  .opt{grid-template-columns:48px 1fr auto}
  .opt .tag{display:none}
  .ringw{width:72px;height:72px}.ringw .num{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  .half,.cmsg,.btn,.opt{transition:none!important}
  .ringw.hot:not(.done),.evi.shake,.stagebox .half{animation:none!important}
  .confetti{display:none}
}
</style>
</head>

const S = DATA.s, Y = DATA.years, NAMES = DATA.names;
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
const r1 = x => Math.round(x * 10) / 10;
const fmt = (v, d) => v.toFixed(d).replace('.', ',');
const A = S.argentina, N = A.length;
const mA = mean(A), medA = median(A);
const maxV = Math.max(...A), minV = Math.min(...A);
const maxY = Y[A.indexOf(maxV)], minY = Y[A.indexOf(minV)];
const rank = Object.keys(S).filter(k => k !== 'argentina').map(k => [k, mean(S[k])]).sort((a, b) => b[1] - a[1]);

let run = 0; for (let i = N - 1; i >= 1 && diffs[i] < 0; i--) run++;
const runFrom = Y[N - run];
const worstI = diffs.reduce((b, d, i) => (i && d < diffs[b] ? i : b), 1);

/* colores de los gráficos */
const C = { ink:'#2A1B5E', soft:'#A99BDB', hi:'#6D3BEA', red:'#D62A52', green:'#0E8F5B', amber:'#E0A800' };

/* ---------- gráficos SVG (600 x 330), calculados desde los datos ---------- */
const svgOpen = '<svg class="ch" viewBox="0 0 600 330" role="img" aria-label="Gráfico con los datos reales del archivo" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,system-ui,sans-serif">';
function chartDots(){
  const x = v => 40 + (v - 8) / 12 * 530, base = 262, bins = {};
  let g = svgOpen;
  for (let t = 8; t <= 20; t += 2) g += '<line class="gl" x1="'+x(t)+'" x2="'+x(t)+'" y1="40" y2="'+base+'"/><text class="t2" x="'+x(t)+'" y="288" font-size="15" font-weight="700" text-anchor="middle">'+fmt(t,0)+'</text>';
  g += '<line class="ax" x1="30" x2="580" y1="'+base+'" y2="'+base+'"/>';
  A.forEach(v => { const k = Math.round(v * 2) / 2; bins[k] = (bins[k] || 0) + 1; g += '<circle cx="'+x(k)+'" cy="'+(base - 11 - (bins[k] - 1) * 19)+'" r="8.5" fill="'+C.soft+'" stroke="#fff" stroke-width="1.5"/>'; });
  const left = mA < medA, lab = (v, txt, col, dash, anchorLeft) =>
    '<line x1="'+x(v)+'" x2="'+x(v)+'" y1="62" y2="'+base+'" stroke="'+col+'" stroke-width="3.5" '+(dash?'stroke-dasharray="8 6"':'')+'/>'
    + '<text x="'+(x(v)+(anchorLeft?-8:8))+'" y="58" font-size="17" font-weight="800" fill="'+col+'" text-anchor="'+(anchorLeft?'end':'start')+'">'+txt+'</text>';
  g += lab(mA, 'Media '+fmt(mA,2), C.red, true, left) + lab(medA, 'Mediana '+fmt(medA,1), C.green, false, !left);
  return g + '<text class="t2" x="305" y="315" font-size="14" font-weight="700" text-anchor="middle">Tasa de natalidad por 1.000 hab.</text></svg>';
}
function chartLine(){
  const x = i => 52 + i / (N - 1) * 520, y = v => 285 - (v - 6) / 15 * 245;
  let g = svgOpen;
  [8, 12, 16, 20].forEach(t => g += '<line class="gl" x1="44" x2="580" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="t2" x="36" y="'+(y(t)+5)+'" font-size="14" font-weight="700" text-anchor="end">'+t+'</text>');
  Y.forEach((yr, i) => { if ((yr - 2000) % 4 === 0) g += '<text class="t2" x="'+x(i)+'" y="310" font-size="14" font-weight="700" text-anchor="middle">'+yr+'</text>'; });
  g += '<polyline fill="none" stroke="'+C.ink+'" stroke-width="3.5" stroke-linejoin="round" points="'+A.map((v, i) => x(i)+','+y(v)).join(' ')+'"/>';
  A.forEach((v, i) => g += '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.5" fill="'+C.ink+'"/>');
  const iM = A.indexOf(maxV), iN = A.indexOf(minV);
  g += '<circle cx="'+x(iM)+'" cy="'+y(maxV)+'" r="11" fill="none" stroke="'+C.green+'" stroke-width="4"/><text x="'+(x(iM)+16)+'" y="'+(y(maxV)-10)+'" font-size="18" font-weight="800" fill="'+C.green+'">Máximo: '+fmt(maxV,1)+' en '+maxY+'</text>';
  g += '<circle cx="'+x(iN)+'" cy="'+y(minV)+'" r="11" fill="none" stroke="'+C.red+'" stroke-width="4"/><text x="'+(x(iN)-16)+'" y="'+(y(minV)-14)+'" font-size="18" font-weight="800" fill="'+C.red+'" text-anchor="end">Mínimo: '+fmt(minV,1)+' en '+minY+'</text>';
  return g + '</svg>';
}
function chartRank(){
  const rows = rank.slice(0, 5).map((r, i) => ({ r, i })).concat([null], rank.slice(-3).map((r, i) => ({ r, i: rank.length - 3 + i })));
  const x0 = 200, sc = v => v / 24 * 370; let g = svgOpen, yy = 18;
  rows.forEach(o => {
    if (!o){ g += '<text class="t2" x="'+x0+'" y="'+(yy+12)+'" font-size="18">· · ·</text>'; yy += 26; return; }
    const [k, v] = o.r, top = o.i === 0, low = o.i === rank.length - 1;
    const col = top ? C.hi : low ? C.red : C.soft;
    g += '<text class="t" x="190" y="'+(yy+18)+'" font-size="16" font-weight="'+(top||low?800:700)+'" text-anchor="end">'+NAMES[k]+'</text>'
      + '<rect x="'+x0+'" y="'+yy+'" width="'+sc(v)+'" height="26" rx="6" fill="'+col+'"/>'
      + '<text class="t" x="'+(x0+sc(v)+8)+'" y="'+(yy+19)+'" font-size="16" font-weight="800">'+fmt(v,2)+'</text>';
    yy += 34;
  });
  return g + '<text class="t2" x="'+x0+'" y="318" font-size="14" font-weight="700">Tasa media 2000–2024, por 1.000 hab.</text></svg>';
}
function chartClasses(){
  const labels = ['8,0–9,9','10,0–11,9','12,0–13,9','14,0–15,9','16,0–17,9','18,0–19,9'];
  const cnt = [0,1,2,3,4,5].map(k => nIn(8 + 2 * k, 10 + 2 * k)), mx = 12, base = 262;
  let g = svgOpen;
  [0, 4, 8, 12].forEach(t => g += '<line class="gl" x1="40" x2="585" y1="'+(base - t / mx * 215)+'" y2="'+(base - t / mx * 215)+'"/><text class="t2" x="32" y="'+(base - t / mx * 215 + 5)+'" font-size="14" font-weight="700" text-anchor="end">'+t+'</text>');
  cnt.forEach((c, k) => {
    const x = 56 + k * 90, h = c / mx * 215, hi = k === 5, col = hi ? C.hi : C.soft;
    g += '<rect x="'+x+'" y="'+(base - h)+'" width="64" height="'+h+'" rx="6" fill="'+col+'"/>'
      + '<text '+(hi?'fill="'+C.hi+'"':'class="t"')+' x="'+(x+32)+'" y="'+(base - h - (hi ? 26 : 8))+'" font-size="'+(hi?20:17)+'" font-weight="800" text-anchor="middle">'+c+(hi?' años':'')+'</text>'
      + (hi ? '<text fill="'+C.hi+'" x="'+(x+32)+'" y="'+(base - h - 8)+'" font-size="17" font-weight="800" text-anchor="middle">('+fmt(c / N * 100,0)+' %)</text>' : '')
      + '<text class="t2" x="'+(x+32)+'" y="286" font-size="13" font-weight="700" text-anchor="middle">'+labels[k]+'</text>';
  });
  return g + '<line class="ax" x1="40" x2="585" y1="'+base+'" y2="'+base+'"/><text class="t2" x="312" y="318" font-size="14" font-weight="700" text-anchor="middle">Clase de tasa de natalidad (años en cada clase)</text></svg>';
}
function chartVar(){
  const z = 105, k = 58, step = 540 / 24, x = i => 44 + (i - 1) * step;
  let g = svgOpen;
  [-2, -1, 0, 1].forEach(t => g += '<line class="'+(t===0?'ax':'gl')+'" x1="40" x2="590" y1="'+(z - t * k)+'" y2="'+(z - t * k)+'"/><text class="t2" x="32" y="'+(z - t * k + 5)+'" font-size="13" font-weight="700" text-anchor="end">'+(t>0?'+':'')+t+'</text>');
  for (let i = 1; i < N; i++){
    const d = diffs[i], h = Math.abs(d) * k, col = d < 0 ? C.red : d > 0 ? C.green : C.amber;
    g += '<rect x="'+x(i)+'" y="'+(d >= 0 ? z - h : z)+'" width="'+(step - 5)+'" height="'+Math.max(h, 3)+'" rx="3" fill="'+col+'" '+(i >= N - run ? '' : 'opacity=".4"')+'/>';
  }
  [2001, 2005, 2010, 2015, 2020, 2024].forEach(yr => g += '<text class="t2" x="'+(x(Y.indexOf(yr)) + (step - 5) / 2)+'" y="262" font-size="13" font-weight="700" text-anchor="middle">'+yr+'</text>');
  const a = x(N - run), b = x(N - 1) + step - 5;
  g += '<path d="M'+a+' 276 v8 H'+b+' v-8" fill="none" stroke="'+C.red+'" stroke-width="3.5"/><text x="'+((a + b) / 2)+'" y="308" font-size="19" font-weight="800" fill="'+C.red+'" text-anchor="middle">'+run+' descensos seguidos</text>';
  return g + '</svg>';
}

function tone(f, d, type, v, at, slide){
  const c = ac(); if (!c) return;
  const t = c.currentTime + (at || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .15, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
}
function whoosh(){
  const c = ac(); if (!c) return;
  const len = c.sampleRate * .7, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
  s.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + .6);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.28, t + .25); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}
const SFX = {
  start(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'square', .09, i * .09)); },
  tick(){ tone(1000, .06, 'square', .06); },
  hot(){ tone(1400, .09, 'square', .09); },
  pick(){ tone(660, .08, 'triangle', .2); tone(880, .1, 'triangle', .2, .07); },
  reveal(){ whoosh(); },
  good(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .2, i * .1)); tone(1319, .5, 'triangle', .18, .42); },
  bad(){ tone(330, .35, 'sawtooth', .12, 0, 140); tone(247, .5, 'sawtooth', .12, .22, 90); },
  timeup(){ tone(220, .25, 'square', .12); tone(220, .5, 'square', .12, .3); },
  fanfare(){ [523, 523, 523, 659, 784, 1047].forEach((f, i) => tone(f, i > 2 ? .35 : .14, 'square', .1, i * .15 + (i > 2 ? .12 : 0))); }
};

const L = 'ABCD', CIRC = 2 * Math.PI * 38;
const state = { view:'start', i:0, answers:[], revealed:false, limit:20, sound:true, left:20, t0:0, timer:null, lastSec:null };
const okIdx = r => r.opts.findIndex(o => o.ok);
const points = () => state.answers.reduce((s, a) => s + (a ? a.pts : 0), 0);
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

function ringHTML(done){
  if (!state.limit) return '';
  const left = state.left, cls = 'ringw' + (left <= 5 && state.limit ? ' hot' : '') + (done ? ' done' : '');
  return '<div class="'+cls+'" id="ring" role="timer" aria-label="Tiempo restante"><svg viewBox="0 0 92 92"><circle class="bg" cx="46" cy="46" r="38" fill="none" stroke-width="9"/><circle class="fg" id="arc" cx="46" cy="46" r="38" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC * (1 - left / state.limit))+'"/></svg><span class="num" id="rnum">'+Math.ceil(left)+'</span></div>';
}
function startHTML(){
  const times = [10, 20, 30, 0].map(v => '<button class="chip" data-action="time" data-v="'+v+'" aria-pressed="'+(state.limit === v)+'">'+(v ? v + ' s' : 'Sin tiempo')+'</button>').join('');
  return '<section class="hero"><div><h1>Adiviná antes de ver</h1>'
    + '<p class="lede">Preguntamos primero y mostramos después. El público apuesta contra el reloj y recién entonces se destapan los datos reales de la natalidad argentina.</p></div>'
    + '<div class="stagebox" aria-hidden="true"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><div class="cover"><div class="half l"></div><div class="half r"></div><div class="cmsg">'+ICON.lock+'<b>Datos tapados</b></div></div></div></section>'
    + '<div class="set"><div><h3>Tiempo para votar</h3><div class="chips">'+times+'</div></div>'
    + '<div class="row-actions"><button class="btn big" data-action="start" id="startBtn">Empezar</button></div></div>'
    + '<ol class="how"><li><b>1</b>Leé la pregunta en voz alta.</li><li><b>2</b>El público vota levantando la mano antes de que se acabe el tiempo.</li><li><b>3</b>Tocá la opción de la mayoría y se abre el telón. Si votan rápido, suman más puntos.</li></ol>'
    + '<p class="src">Tasa de natalidad por 1.000 habitantes. Fuente: DEIS, archivo tasa-natalidad-deis-2000-2024.csv. Con el sonido activado se escuchan efectos; podés silenciarlo con el botón de arriba o la tecla M.</p>';
}
function roundHTML(){
  const r = ROUNDS[state.i], a = state.answers[state.i], rev = state.revealed, good = okIdx(r);
  let opts = '';
  r.opts.forEach((o, k) => {
    let cls = 'opt', mark = '', tag = '';
    if (rev){
      if (k === good){ cls += ' ok'; mark = ICON.ok; }
      else if (k === a.pick){ cls += ' no'; mark = ICON.no; }
      else cls += ' dim';
      if (k === a.pick) tag = '<span class="tag">Votó el público</span>';
    }
    opts += '<button class="'+cls+'" data-action="pick" data-k="'+k+'" '+(rev?'disabled':'')+' aria-label="Opción '+L[k]+': '+o.t+'"><span class="ltr">'+L[k]+'</span><span>'+o.t+'</span>'+tag+'<span class="mark">'+mark+'</span></button>';
  });
  let h = '<div class="qcard"><h2 class="q"><span class="qn">Pregunta '+(state.i+1)+' de '+ROUNDS.length+'</span>'+r.q+'</h2>'+ringHTML(rev)+'</div>'
    + '<div class="play"><div class="opts"><p class="opts-cap">'+(rev ? 'Respuesta del público y respuesta correcta' : 'Tocá la opción que eligió la mayoría')+'</p>'+opts+'</div>'
    + '<div class="evi'+(rev?' open snap':'')+'" id="evi"><h2>'+r.evT+'</h2><div '+(rev?'':'aria-hidden="true"')+'>'+r.chart()+'</div>'
    + '<div class="cover" aria-hidden="'+(rev?'true':'false')+'"><div class="half l"></div><div class="half r"></div><div class="cmsg">'+ICON.lock+'<b>Datos tapados</b><span>El telón se abre cuando el público apuesta.</span></div></div></div></div>';
  if (rev){
    const last = state.i === ROUNDS.length - 1, to = a.timeout;
    h += '<div class="result '+(a.ok?'ok':'no')+'" role="status"><div><p class="verdict">'+(to?ICON.clock:a.ok?ICON.ok:ICON.no)+(to?'Se acabó el tiempo':a.ok?'El público acertó':'El público falló')+'</p>'
      + '<p class="answer">Respuesta correcta: <b>'+L[good]+'. '+r.opts[good].t+'</b></p>'+(a.ok?'<span class="bonus">+'+a.pts+' puntos</span>':'')+'</div>'
      + '<p class="note">'+r.note+'</p>'
      + '<button class="btn" data-action="next" id="nextBtn">'+(last?'Ver resultado':'Siguiente')+'</button></div>';
  }
  return h;
}
function endHTML(){
  const hits = state.answers.filter(x => x.ok).length;
  const msg = hits === ROUNDS.length ? 'El público adivinó todo.' : hits >= 3 ? 'El público intuyó bien los datos.' : 'Los datos sorprendieron al público.';
  let rows = '';
  ROUNDS.forEach((r, k) => {
    const a = state.answers[k], g = okIdx(r);
    rows += '<li><span class="k">'+(k+1)+'</span><span>'+r.q+' <b>'+r.opts[g].t+'.</b></span><span class="v '+(a.ok?'ok':'no')+'">'+(a.ok?ICON.ok:a.timeout?ICON.clock:ICON.no)+(a.ok?'Acertó':a.timeout?'Sin tiempo':'Eligió '+r.opts[a.pick].t)+'</span></li>';
  });
  return '<div class="final"><span class="n">'+hits+' de '+ROUNDS.length+'</span><span class="tt">'+msg+'</span><span class="pp">'+points()+' puntos'+(state.limit ? ' con '+state.limit+' segundos por ronda' : ', sin límite de tiempo')+'</span></div><ul class="recap">'+rows+'</ul>'
    + '<div class="row-actions"><button class="btn" data-action="again">Jugar de nuevo</button><button class="btn ghost" data-action="home">Cambiar el tiempo</button></div>';
}
function header(){
  const seg = [];
  for (let k = 0; k < ROUNDS.length; k++){ const a = state.answers[k]; seg.push('<span class="seg '+(a ? (a.ok?'ok':'no') : (state.view==='round' && k===state.i ? 'cur' : ''))+'"></span>'); }
  document.getElementById('progress').innerHTML = seg.join('');
  document.getElementById('score').innerHTML = state.answers.length ? 'Puntos <b>'+points()+'</b>' : '';
  const b = document.getElementById('sndBtn'); b.innerHTML = state.sound ? ICON.on : ICON.off;
  b.setAttribute('aria-label', state.sound ? 'Silenciar sonido' : 'Activar sonido'); b.setAttribute('aria-pressed', String(!state.sound));
}

/* ---------- temporizador ---------- */
function stopTimer(){ if (state.timer){ clearInterval(state.timer); state.timer = null; } }
function startTimer(){
  stopTimer(); state.left = state.limit; state.lastSec = null;
  if (!state.limit) return;
  state.t0 = performance.now();
  state.timer = setInterval(() => {
    state.left = Math.max(0, state.limit - (performance.now() - state.t0) / 1000);
    const ring = document.getElementById('ring'); if (!ring) return;
    document.getElementById('arc').setAttribute('stroke-dashoffset', CIRC * (1 - state.left / state.limit));
    const sec = Math.ceil(state.left); document.getElementById('rnum').textContent = sec;
    ring.classList.toggle('hot', state.left <= 5);
    if (sec !== state.lastSec){ state.lastSec = sec; if (sec > 0 && sec <= 5) SFX.hot(); else if (sec > 5 && state.limit >= 20 && sec % 5 === 0) SFX.tick(); }
    if (state.left <= 0) timeUp();
  }, 100);
}
function timeUp(){
  if (state.view !== 'round' || state.revealed) return;
  stopTimer();
  state.answers[state.i] = { pick:-1, ok:false, timeout:true, pts:0 };
  state.revealed = true; SFX.timeup(); render(true);
  setTimeout(SFX.reveal, 600);
}

/* ---------- confeti ---------- */
function confetti(){
  if (reduced()) return;
  const box = document.createElement('div'); box.className = 'confetti'; const cols = ['#FFC93C', '#35D391', '#FF6B88', '#8CB4FF', '#fff'];
  for (let n = 0; n < 46; n++){ const p = document.createElement('i'); p.style.cssText = 'left:'+(Math.random()*100)+'%;background:'+cols[n%5]+';--x:'+((Math.random()-.5)*240)+'px;--r:'+(Math.random()*720)+'deg;--d:'+(1.4+Math.random()*1.2)+'s;animation-delay:'+(Math.random()*.25)+'s'; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3200);
}

function render(animate){
  const st = document.getElementById('stage');
  st.innerHTML = state.view==='start' ? startHTML() : state.view==='round' ? roundHTML() : endHTML();
  header();
  if (state.view==='round' && state.revealed){
    const e = document.getElementById('evi');
    if (animate){ e.classList.remove('open'); void e.offsetWidth; e.classList.remove('snap'); void e.offsetWidth; e.classList.add('open'); }
    const b = document.getElementById('nextBtn'); if (b) b.focus({ preventScroll:true });
    if (animate){ const r = document.querySelector('.result'); r && r.scrollIntoView({ block:'end', behavior: reduced() ? 'auto' : 'smooth' }); return; }
  }
  window.scrollTo(0, 0);
}
function pick(k){
  if (state.view!=='round' || state.revealed) return;
  const r = ROUNDS[state.i]; if (k < 0 || k >= r.opts.length) return;
  stopTimer();
  const ok = r.opts[k].ok, pts = ok ? 100 + (state.limit ? Math.round(state.left) * 10 : 0) : 0;
  state.answers[state.i] = { pick:k, ok, pts };
  state.revealed = true; SFX.pick(); render(true);
  setTimeout(SFX.reveal, 250);
  setTimeout(() => { if (ok){ SFX.good(); confetti(); } else { SFX.bad(); const e = document.getElementById('evi'); if (e && !reduced()){ e.classList.add('shake'); setTimeout(() => e.classList.remove('shake'), 500); } } }, 950);
}
function next(){
  if (state.view!=='round' || !state.revealed) return;
  if (state.i === ROUNDS.length - 1){ state.view = 'end'; render(); SFX.fanfare(); if (state.answers.filter(x => x.ok).length >= 4) setTimeout(confetti, 500); }
  else { state.i++; state.revealed = false; render(); startTimer(); }
}
function begin(){ state.answers = []; state.i = 0; state.revealed = false; state.view = 'round'; SFX.start(); render(); startTimer(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action;
  if (a==='start' || a==='again') begin();
  else if (a==='pick') pick(+t.dataset.k);
  else if (a==='next') next();
  else if (a==='home'){ stopTimer(); state.view='start'; state.answers=[]; render(); }
  else if (a==='time'){ state.limit = +t.dataset.v; state.left = state.limit; render(); const c = document.querySelector('.chip[aria-pressed=true]'); c && c.focus(); }
  else if (a==='sound'){ state.sound = !state.sound; header(); if (state.sound) SFX.pick(); }
});
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm'){ state.sound = !state.sound; header(); if (state.sound) SFX.pick(); return; }
  if (state.view==='round' && !state.revealed){
    const i = 'abcd'.indexOf(k); if (i >= 0 && k.length === 1) pick(i);
    else if ('1234'.includes(k) && k.length === 1) pick(+k - 1);
  } else if (state.view==='round' && state.revealed){
    if (e.target.closest && e.target.closest('button') && (k==='enter' || k===' ')) return;
    if (k==='enter' || k===' ' || k==='arrowright'){ e.preventDefault(); next(); }
  }
});
render();
</script>
</body>
</html>
